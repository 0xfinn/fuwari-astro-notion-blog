name: Scheduled Vercel Deploy
on:
  schedule:
    - cron: '0 2 * * *' # 每天凌晨2点（UTC）自动触发
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Trigger Vercel Deploy
        run: |
          curl -X POST "https://api.vercel.com/v1/integrations/deploy/prj_Um3k84D2fke22NLe2BzYYThj1GgL/ZP3QhxIzTM" # 替换为你的 Vercel Deploy Hook URL